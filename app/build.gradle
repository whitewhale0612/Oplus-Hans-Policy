plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.whitewhale.hanspolicy'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.github.whitewhale.hanspolicy'
        minSdk 28
        targetSdk 35
        versionCode 5
        versionName '0.3.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    compileOnly files('libs/xposed-api-82.jar')
}
