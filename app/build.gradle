plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.whitewhale.hanspolicy'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'io.github.whitewhale.hanspolicy'
        minSdk 28
        targetSdk 35
        versionCode 8
        versionName '0.6.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'RUNTIME_EVENT_LOGS', 'true'
        }
        release {
            minifyEnabled false
            buildConfigField 'boolean', 'RUNTIME_EVENT_LOGS', 'false'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    compileOnly files('libs/xposed-api-82.jar')
    testImplementation 'junit:junit:4.13.2'
}
